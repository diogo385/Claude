<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argos Trade Cripto · Extrato</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Extrato da conta simulada: entradas, saídas e saldo em reais, lidos de simulado/extrato.csv */
:root {
  --bg: #06100e; --panel: #0a1714; --panel-2: #0d1f1b; --line: #173029; --line-hi: #24493f;
  --fg: #d9f2ea; --muted: #7fa398; --dim: #4f7067;
  --green: #3df59a; --teal: #2ee6c8; --amber: #ffb547; --red: #ff5d6c; --violet: #a78bfa;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 13px; line-height: 1.45;
  background-image: radial-gradient(900px 420px at 50% -10%, rgba(61, 245, 154, .08), transparent 70%); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 14px; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--green); } .down { color: var(--red); }
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 48px; height: 48px; border-radius: 50%; }
h1 { font-family: var(--display); font-size: clamp(1.3rem, 3vw, 1.8rem); margin: 0; }
h1 span { color: var(--amber); }
.btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--teal); text-decoration: none; border: 1px solid var(--teal); border-radius: 6px; padding: 6px 12px; background: rgba(46,230,200,.06); }
.btn:hover { box-shadow: 0 0 14px rgba(46,230,200,.3); }
.btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel-2); }
.tile .lab { color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
.tile .v { font-family: var(--display); font-size: 1.45rem; font-weight: 700; margin-top: 2px; }
.tile .s { color: var(--dim); font-size: 11px; }
.box { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 12px; min-width: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: inherit; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 5px 10px; cursor: pointer; border: 1px solid var(--line-hi); background: var(--panel); color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--teal); border-color: var(--teal); }
.seg button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.count { color: var(--dim); font-size: 11px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 6px; border-bottom: 1px solid var(--line-hi); white-space: nowrap; }
td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; white-space: nowrap; }
tr.dia td { background: var(--panel); color: var(--muted); font-size: 11px; letter-spacing: .08em; padding: 5px 6px; }
.chip { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; }
.c-dep { color: var(--amber); } .c-compra { color: var(--violet); } .c-venda { color: var(--green); } .c-transf { color: var(--teal); }
.conta { color: var(--muted); font-size: 11px; }
.taxa { color: var(--dim); font-size: 11px; }
.empty { color: var(--muted); padding: 10px 0; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="assets/simbolo-argos.png" alt=""><h1><span>Argos Trade</span> Cripto · Extrato</h1></div>
    <a class="btn" href="./">← Monitor</a>
  </header>

  <section class="tiles">
    <div class="tile"><div class="lab">Total depositado</div><div class="v num" id="tDep">--</div><div class="s" id="tDepS">--</div></div>
    <div class="tile"><div class="lab">Saldo em reais</div><div class="v num" id="tSaldo">--</div><div class="s" id="tSaldoS">--</div></div>
    <div class="tile"><div class="lab">Em cripto</div><div class="v num" id="tCripto">--</div><div class="s" id="tCriptoS">pelo último preço do robô</div></div>
    <div class="tile"><div class="lab">Taxas pagas</div><div class="v num" id="tTaxa">--</div><div class="s" id="tTaxaS">--</div></div>
  </section>

  <section class="box">
    <div class="bar">
      <div class="seg" id="filtro">
        <button type="button" data-f="" aria-pressed="true">Tudo</button>
        <button type="button" data-f="Principal" aria-pressed="false">Principal</button>
        <button type="button" data-f="Reserva" aria-pressed="false">Reserva</button>
        <button type="button" data-f="Satélite" aria-pressed="false">Satélite</button>
      </div>
      <span class="count" id="count">--</span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Hora</th><th>Conta</th><th>Tipo</th><th>Descrição</th><th class="r">Valor</th><th class="r">Saldo</th></tr></thead>
        <tbody id="linhas"><tr><td colspan="6" class="empty">carregando…</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const nf = (v, d = 2) => v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
  const brl = v => "R$ " + nf(v);
  const sinal = v => (v > 0.0049 ? "+" : v < -0.0049 ? "−" : "") + "R$ " + nf(Math.abs(v));
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
  const CHIP = { "DEPÓSITO": "c-dep", "COMPRA": "c-compra", "VENDA": "c-venda", "TRANSFERÊNCIA": "c-transf" };
  let movs = [], filtro = "";

  async function baixar(arq) {
    const r = await fetch(`simulado/${arq}?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(arq);
    return r.text();
  }
  function csv(txt) {
    const linhas = txt.trim().split(/\r?\n/); const cab = linhas.shift().split(";");
    return linhas.filter(Boolean).map(l => { const v = l.split(";"); const o = {}; cab.forEach((c, i) => o[c] = v[i]); return o; });
  }

  function resumo(estado) {
    const dep = movs.filter(m => m.tipo === "DEPÓSITO");
    const total = dep.reduce((t, m) => t + +m.valor, 0);
    $("tDep").textContent = brl(total);
    $("tDepS").textContent = dep.map(m => `${m.conta} ${brl(+m.valor)}`).join(" · ");
    const saldo = movs.length ? +movs[movs.length - 1].saldo_reais : 0;
    $("tSaldo").textContent = brl(saldo);
    const taxas = movs.reduce((t, m) => t + (+m.taxa || 0), 0);
    $("tTaxa").textContent = brl(taxas);
    $("tTaxaS").textContent = `${movs.filter(m => m.tipo === "COMPRA" || m.tipo === "VENDA").length} compras e vendas`;
    if (estado) {
      const p = estado.ultimos_precos || {};
      const cripto = (c, alvo) => Object.keys(alvo).reduce((t, a) => t + (c[a] || 0) * (p[a] || 0), 0);
      const sat = estado.satelite;
      const vc = cripto(estado.carteira, estado.alvo) + (sat ? cripto(sat.carteira, sat.alvo) : 0);
      $("tCripto").textContent = brl(vc);
      const partes = [`principal ${brl(estado.carteira.reais)}`, `reserva ${brl((estado.reserva || {}).saldo || 0)}`];
      if (sat) partes.push(`satélite ${brl(sat.carteira.reais)}`);
      $("tSaldoS").textContent = partes.join(" · ");
    }
  }

  function tabela() {
    const tb = $("linhas"); tb.textContent = "";
    const lista = movs.filter(m => !filtro || m.conta === filtro).slice().reverse();
    $("count").textContent = `${lista.length} ${lista.length === 1 ? "lançamento" : "lançamentos"}`;
    if (!lista.length) { const tr = el("tr"); const td = el("td", "empty", "Nenhum lançamento."); td.colSpan = 6; tr.appendChild(td); tb.appendChild(tr); return; }
    let dia = null;
    lista.forEach(m => {
      const d = m.data_hora.slice(0, 10);
      if (d !== dia) {
        dia = d; const tr = el("tr", "dia"); const td = el("td", "", `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}`); td.colSpan = 6; tr.appendChild(td); tb.appendChild(tr);
      }
      const tr = el("tr");
      tr.appendChild(el("td", "num", m.data_hora.slice(11, 16)));
      tr.appendChild(el("td", "conta", m.conta));
      const t = el("td"); t.appendChild(el("span", "chip " + (CHIP[m.tipo] || ""), m.tipo)); tr.appendChild(t);
      const ds = el("td"); ds.appendChild(el("div", "", m.descricao));
      if (+m.taxa > 0) ds.appendChild(el("div", "taxa", `taxa ${brl(+m.taxa)}`));
      tr.appendChild(ds);
      const v = +m.valor;
      tr.appendChild(el("td", "r num " + (v > 0.0049 ? "up" : v < -0.0049 ? "down" : ""), sinal(v)));
      tr.appendChild(el("td", "r num", brl(+m.saldo_reais)));
      tb.appendChild(tr);
    });
  }

  $("filtro").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filtro = b.dataset.f; document.querySelectorAll("#filtro button").forEach(x => x.setAttribute("aria-pressed", x === b)); tabela();
  });

  async function carregar() {
    let estado = null;
    try { movs = csv(await baixar("extrato.csv")); } catch (e) { movs = []; }
    try { estado = JSON.parse(await baixar("estado.json")); } catch (e) { /* sem estado: só o extrato */ }
    resumo(estado); tabela();
  }
  carregar(); setInterval(carregar, 5 * 60000);
})();
</script>
</body>
</html>
