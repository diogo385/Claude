<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argos Trade Cripto · Histórico</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* padrão visual do monitor (index.html): moldura, barra de navegação, cabeçalho com números-chave e quadros */
:root {
  --bg: #070b14; --panel: #0a101c; --panel-2: #0e1626; --line: #1d2a44; --line-hi: #2c4170;
  --fg: #dbe6ff; --muted: #8494b6; --dim: #7d8db0;
  --green: #3ef0a0; --teal: #3ee0ff; --amber: #ffb547; --red: #ff5d73; --violet: #9b7bff;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 13px; line-height: 1.45;
  background-image:
    radial-gradient(1200px 500px at 85% -10%, rgba(62, 224, 255, .10), transparent 60%),
    radial-gradient(900px 500px at -10% 20%, rgba(155, 123, 255, .10), transparent 60%),
    linear-gradient(rgba(80, 140, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(80, 140, 255, .06) 1px, transparent 1px);
  background-size: auto, auto, 32px 32px, 32px 32px; background-attachment: fixed; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px 40px; }
.frame { border: 1px solid var(--line-hi); border-radius: 14px; background: var(--panel); overflow: hidden; }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--teal); text-decoration: none; border: 1px solid var(--teal); border-radius: 6px; padding: 4px 12px; background: rgba(62,224,255,.06); }
.btn:hover { box-shadow: 0 0 14px rgba(62,224,255,.3); }
.btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn.ghost { color: var(--muted); border-color: var(--line-hi); background: none; }
.btn[aria-current="page"] { color: var(--fg); border-color: var(--fg); background: rgba(219,230,255,.06); pointer-events: none; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--green); } .down { color: var(--red); } .warn { color: var(--amber); }
.head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 18px; border-bottom: 1px solid var(--line); }
.logo { overflow: hidden; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #12264a, #070b14); border: 1px solid var(--line-hi); box-shadow: 0 0 24px rgba(62,224,255,.2); }
.logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
h1 { font-family: var(--display); font-size: clamp(1.4rem, 3.2vw, 2rem); margin: 0; line-height: 1.1; }
h1 span { color: var(--amber); }
.sub { margin-top: 8px; color: var(--muted); font-size: 12px; }
.kpis { display: grid; grid-template-columns: repeat(2, auto); gap: 6px 26px; text-align: right; }
.kpis .big { font-family: var(--display); font-size: 1.7rem; font-weight: 700; line-height: 1; }
.kpis .lab { color: var(--muted); font-size: 11px; }
.main { padding: 12px; display: grid; gap: 12px; min-width: 0; }
.box { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 12px; min-width: 0; }
.box h2 { margin: 0 0 10px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.box h2 small { letter-spacing: 0; text-transform: none; color: var(--dim); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: inherit; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 5px 10px; cursor: pointer; border: 1px solid var(--line-hi); background: var(--panel); color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--teal); border-color: var(--teal); box-shadow: 0 0 10px rgba(62,224,255,.2); }
.seg button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.count { color: var(--dim); font-size: 11px; }
.scroll { overflow-x: auto; }
.empty { color: var(--muted); padding: 10px 0; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel); }
.tile .lab { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.tile .v { font-family: var(--display); font-size: 1.15rem; font-weight: 700; margin-top: 2px; }
.tile .s { color: var(--dim); font-size: 11px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-bottom: 1px solid var(--line-hi); white-space: nowrap; }
td { padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; white-space: nowrap; }
tr.dia td { background: var(--panel); color: var(--muted); font-size: 11px; letter-spacing: .08em; padding: 5px 6px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .head { grid-template-columns: auto minmax(0, 1fr); }
  .kpis { grid-column: 1 / -1; text-align: left; }
}
/* histórico */
@media (max-width: 600px) {
  .log tr:not(.dia) { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 8px; padding: 8px 2px; border-top: 1px solid var(--line); }
  .log tr:not(.dia) td { border: 0; padding: 0; }
  .log tr:not(.dia) td:nth-child(3) { grid-column: 1 / -1; grid-row: 2; }
  .log tr:not(.dia) td:nth-child(4) { grid-column: 3; grid-row: 1; }
  .log tr.dia td { display: block; }
}
.log { width: 100%; border-collapse: collapse; font-size: 12px; }
.log td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.log tr.dia td { background: var(--panel); color: var(--muted); font-size: 11px; letter-spacing: .08em; padding: 5px 6px; }
.side { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.side.buy { color: var(--violet); border: 1px solid var(--violet); }
.side.sell { color: var(--green); border: 1px solid var(--green); }
.side.sat { color: var(--teal); border: 1px solid var(--teal); margin-left: 4px; }
.side.aporte { color: var(--amber); border: 1px solid var(--amber); }
.why { color: var(--muted); font-size: 11px; }
.r { text-align: right; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame">
    <div class="nav"><span>Argos Trade Cripto · terminal</span><span class="links"><a class="btn" href="./">← Monitor</a><a class="btn ghost" href="painel-ativos.html?v=15">📈 Mercado ao vivo</a><a class="btn ghost" href="historico.html?v=15" aria-current="page">Histórico</a><a class="btn ghost" href="extrato.html?v=15">Extrato</a><a class="btn ghost" href="regras.html?v=15">Regras</a></span></div>
    <header class="head">
      <div class="logo"><img src="assets/simbolo-argos.png" alt="Logo do sistema" width="64" height="64"></div>
      <div><h1><span>Argos Trade</span> Cripto · Histórico</h1><div class="sub" id="sub">carregando…</div></div>
      <div class="kpis"><div><div class="big num" id="kOps">--</div><div class="lab">operações</div></div><div><div class="big num" id="kGiros">--</div><div class="lab">giros concluídos</div></div><div><div class="big num" id="kVol">--</div><div class="lab">volume negociado</div></div><div><div class="big num" id="kTaxa">--</div><div class="lab">taxas pagas</div></div></div>
    </header>
    <main class="main">
  <section class="box">
    <h2>Operações <small>mais recentes primeiro</small></h2>
    <div class="bar">
      <div class="seg" id="filtro">
        <button type="button" data-f="" aria-pressed="true">Tudo</button>
        <button type="button" data-f="principal" aria-pressed="false">Principal</button>
        <button type="button" data-f="satelite" aria-pressed="false">Satélite</button>
        <button type="button" data-f="oport" aria-pressed="false">Giros</button>
        <button type="button" data-f="reserva" aria-pressed="false">Reserva</button>
      </div>
      <span class="count" id="count">--</span>
    </div>
    <div class="scroll" id="logBox"><div class="empty">carregando…</div></div>
  </section>
    </main>
  </div>
</div>

<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const nf = (v, d = 2) => v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
  const casas = v => v >= 1000 ? 0 : v >= 10 ? 2 : 4;
  const brl = (v, d) => "R$ " + nf(v, d === undefined ? 2 : d);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
  const SIMB = { btc: "₿", eth: "Ξ" };
  let estado = null, ops = [], opsSat = [], filtro = "";

  async function baixar(arq) {
    const r = await fetch(`simulado/${arq}?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(arq);
    return r.text();
  }
  function csv(txt) {
    const linhas = txt.trim().split(/\r?\n/); const cab = linhas.shift().split(";");
    return linhas.filter(Boolean).map(l => { const v = l.split(";"); const o = {}; cab.forEach((c, i) => o[c] = v[i]); return o; });
  }

  function grupo(o) {
    if (o.tipo === "APORTE") return "reserva";
    if (o.tipo === "OPORTUNIDADE" || o.tipo === "LUCRO") return "oport";
    return o.sat ? "satelite" : "principal";
  }

  function render() {
    const box = $("logBox"); box.textContent = "";
    const sat = estado && estado.satelite;
    const aps = ((estado && estado.reserva && estado.reserva.aportes) || []).map(a => ({ data_hora: a.data_hora, tipo: "APORTE", ap: a }));
    const sats = opsSat.map(o => Object.assign({ sat: true }, o));
    const todas = ops.concat(aps, sats).sort((x, y) => x.data_hora < y.data_hora ? -1 : x.data_hora > y.data_hora ? 1 : (x.tipo === "APORTE" ? -1 : 1));
    // números do cabeçalho (montagem da satélite não conta como operação do robô)
    const opsRobo = ops.concat(sats.filter(o => !(o.tipo === "COMPRA" && +o.peso_antes === 0)));
    $("kOps").textContent = String(opsRobo.length);
    $("kGiros").textContent = String(sats.filter(o => o.tipo === "LUCRO").length);
    $("kVol").textContent = brl(opsRobo.reduce((t, o) => t + +o.valor_reais, 0));
    $("kTaxa").textContent = brl(opsRobo.reduce((t, o) => t + +o.taxa, 0));
    const nP = ops.length, nS = sats.filter(o => +o.peso_antes > 0 && o.tipo !== "OPORTUNIDADE" && o.tipo !== "LUCRO").length, nG = sats.filter(o => o.tipo === "OPORTUNIDADE" || o.tipo === "LUCRO").length;
    const ult = todas.length ? todas[todas.length - 1].data_hora : null;
    $("sub").textContent = `principal ${nP} · satélite ${nS} · giros ${nG} · reserva ${aps.length}` + (ult ? ` · última em ${ult.slice(8, 10)}/${ult.slice(5, 7)} ${ult.slice(11, 16)}` : "");
    const linhas = todas.filter(o => !filtro || grupo(o) === filtro);
    $("count").textContent = `${linhas.length} ${linhas.length === 1 ? "registro" : "registros"}`;
    if (!linhas.length) { box.appendChild(el("div", "empty", "Nenhuma operação ainda.")); return; }
    const t = el("table", "log"), tb = el("tbody");
    let dia = null;
    linhas.slice().reverse().forEach(o => {
      const d = o.data_hora.slice(0, 10);
      if (d !== dia) { dia = d; const tr = el("tr", "dia"), td = el("td", "", `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}`); td.colSpan = 4; tr.appendChild(td); tb.appendChild(tr); }
      const tr = el("tr");
      tr.appendChild(el("td", "num", o.data_hora.slice(11, 16)));
      if (o.tipo === "APORTE") {
        const t2 = el("td"); t2.appendChild(el("span", "side aporte", "APORTE")); tr.appendChild(t2);
        const t3 = el("td"); t3.append(el("b", "", "$ Reserva → carteira principal"), el("div", "why", `degrau de ${Math.round(o.ap.degrau * 100)}% · a carteira estava ${nf(o.ap.queda * 100, 1)}% abaixo do pico`)); tr.appendChild(t3);
        tr.appendChild(el("td", "r num warn", brl(o.ap.valor))); tb.appendChild(tr); return;
      }
      const a = o.ativo.toLowerCase();
      const td2 = el("td"); td2.appendChild(el("span", "side " + (o.tipo === "VENDA" || o.tipo === "LUCRO" ? "sell" : "buy"), o.tipo === "OPORTUNIDADE" ? "GIRO · COMPRA" : o.tipo === "LUCRO" ? "GIRO · VENDA" : o.tipo)); if (o.sat) td2.appendChild(el("span", "side sat", "SAT")); tr.appendChild(td2);
      const td3 = el("td"); const q = +o.quantidade;
      td3.append(el("b", "", `${SIMB[a] || "●"} ${o.ativo} · ${nf(q, q < 1 ? 6 : 4)}`),
        el("div", "why", (o.tipo === "OPORTUNIDADE" ? "compra automática do giro · vende sozinho com +1,5%" :
          o.tipo === "LUCRO" ? "venda automática do giro com +1,5% · dinheiro voltou para a reserva do giro" :
          o.sat && +o.peso_antes === 0 ? "montagem da satélite" :
          `motivo: ${o.ativo} estava em ${nf(+o.peso_antes * 100, 1)}% da ${o.sat ? "satélite" : "carteira"} (alvo ${Math.round(((o.sat ? sat && sat.alvo[a] : estado && estado.alvo[a]) || 0) * 100)}%)`) +
          ` · preço ${brl(+o.preco, +o.preco < 1 ? 4 : casas(+o.preco))} · taxa ${brl(+o.taxa)}`));
      tr.appendChild(td3);
      tr.appendChild(el("td", "r num", brl(+o.valor_reais)));
      tb.appendChild(tr);
    });
    t.appendChild(tb); box.appendChild(t);
  }

  $("filtro").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filtro = b.dataset.f; document.querySelectorAll("#filtro button").forEach(x => x.setAttribute("aria-pressed", x === b)); render();
  });

  async function carregar() {
    try { estado = JSON.parse(await baixar("estado.json")); } catch (e) { estado = null; }
    try { ops = csv(await baixar("operacoes.csv")); } catch (e) { ops = []; }
    try { opsSat = csv(await baixar("operacoes_satelite.csv")); } catch (e) { opsSat = []; }
    render();
  }
  carregar(); setInterval(carregar, 5 * 60000);
})();
</script>
</body>
</html>
