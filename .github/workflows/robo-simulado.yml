name: Robô simulado (rebalanceamento diário)

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 21:00 em Brasília
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: robo-simulado
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o robô simulado
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python simulado/robo_simulado.py

      - name: Salvar a carteira simulada no repositório
        if: always()
        run: |
          git config user.name "robo-simulado"
          git config user.email "robo-simulado@users.noreply.github.com"
          git add simulado/
          git diff --cached --quiet || git commit -m "Robô simulado: execução de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push
