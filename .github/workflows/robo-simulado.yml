name: Argos Trade Cripto · robô simulado

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada 15 min: oportunidades da satélite; carteiras rebalanceiam a cada ~4 h; resumo às 7h (Brasília) 
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: robo-simulado
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o robô simulado
        id: robo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python simulado/robo_simulado.py

      - name: Salvar a carteira simulada no repositório
        if: always() && (steps.robo.outputs.salvar == 'true' || steps.robo.outputs.salvar == 'erro')
        run: |
          git config user.name "argos-trade-cripto"
          git config user.email "argos-trade-cripto@users.noreply.github.com"
          if [ "${{ steps.robo.outputs.salvar }}" = "erro" ]; then git add simulado/saude.json; else git add simulado/; fi
          git diff --cached --quiet || git commit -m "Argos Trade Cripto (simulado): execução de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git push
